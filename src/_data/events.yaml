# yaml-language-server: $schema=../../schema/events.schema.json
#
# Upcoming GD SEPAC events, shown on the Meetings & Events page.
#
# Each event is one list entry. Fields:
#   title        (required)  The event name, e.g. "General Meeting".
#   date         (required)  When it starts, in Eastern Time, as
#                            YYYY-MM-DDTHH:MM, e.g. "2026-09-18T19:00".
#                            The page displays it as "Friday, September 18,
#                            2026, 7:00 PM". Events drop off the site
#                            automatically the day after their date (the site
#                            is rebuilt once a day).
#   location     (optional)  Where it happens, e.g. "Groton Dunstable Middle School".
#   description  (optional)  A sentence or two about the event. Supports inline
#                            Markdown, e.g. [Register](https://…) for a link.
#   image        (optional)  A picture, with two parts:
#                              src  the file path, which MUST start with /assets/
#                                   (put the image file in the assets/ folder first).
#                              alt  a short description of the picture for screen
#                                   readers; use "" for a purely decorative image.
#   link         (optional)  A button, with two parts:
#                              url    where the button goes.
#                              label  the button text, e.g. "RSVP".
#
# Copy-paste example (delete the leading "# " on each line to use it):
#
# - title: "General Meeting"
#   date: "2026-09-18T19:00"
#   location: "Virtual (Zoom)"
#   description: "Updates from Student Services and open discussion. All are welcome."
#   image:
#     src: /assets/events/general-meeting.webp
#     alt: "Parents seated in a circle during a SEPAC meeting"
#   link:
#     url: "https://example.com/rsvp"
#     label: "RSVP"
#
# To have no events, change the list below to `[]`.
- title: "SEPAC Walk & Talk"
  date: "2026-09-11T09:30"
  location: "Groton Rail Trail parking lot behind the library"
  description: "Join us for a casual morning walk, conversation, and connection. Rainy Day? We'll meet at Salt & Light instead."
- title: "Recognizing Learning Disabilities and Advocating for Supports in School"
  date: "2026-09-16T18:30"
  location: "Online (Microsoft Teams)"
  description: "The Lurie Center for Autism invites you to join Rachel Goldin, PhD, and Elise Wulff, MEd, to learn how to recognize common signs of learning disabilities and advocate for the supports students need in school. We'll discuss signs that may appear at home and in the classroom, how to navigate the school support process, and strategies for collaborating effectively with educators. [Register for the webinar](https://events.teams.microsoft.com/event/3cdfa06a-c8e5-422f-8ea6-c6e11c79782d@720edb1f-5c4e-4043-8141-214a63a7ead5?source=copyLinkOneEventsShareDialog) to receive the Microsoft Teams link by email before the event."
- title: "General Meeting – Virtual Welcome Back"
  date: "2026-09-24T19:00"
  location: "Online (Zoom)"
  description: "Join us for our first general meeting of the school year and hear from Jill Greene about the 2026–27 school year. [Join the Zoom meeting](https://us02web.zoom.us/j/87809897711?pwd=w6eliG4CuAdHXim2N9vRsimoMQNey9.1)."
- title: "Evening with Lisa Drennan (MERGE Inclusion Consulting)"
  date: "2026-10-08T19:00"
  location: "Middle School Performing Arts Center"
  description: "Join us for an inspiring evening with Lisa Drennan (MERGE Inclusion Consulting) as we explore how every member of our community can help create spaces where all students feel included and supported. Arrive early to visit local community vendors and resource tables before the session begins. Hosted by Groton-Dunstable SEPAC. Made possible by a grant from the Town of Groton's Trust Fund's Lecture Fund. Free and open to all."
